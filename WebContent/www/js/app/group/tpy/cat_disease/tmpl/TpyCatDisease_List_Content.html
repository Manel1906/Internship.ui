<ul id="ul-list" class="list-unstyled chat-list" data-simplebar style="max-height: calc(100vh - 350px)';">
{{#if data}}
{{#each data}}
    <li class="chat-item" data-id="{{id}}">
        <a href="#">
            <div class="media align-items-center" style="background-color: #EBEBEB;">
                <div class="avatar-xs mr-3" style="width: 50px; height: 50px; background-color: #0064AF;">
                    <span class="avatar-title text-white">
<!--                         {{reqFirstLetter name}} -->
						{{code}}
                    </span>
                </div>
                <div class="media-body">
                    <h5 class=" mb-0">{{name}}</h5>
                    <p class="font-size-12 mb-0">{{inf.nameEng}}</p>
                </div>
                <div>
                	<i class="mdi mdi-chevron-right" style="font-size: 25px;"></i>
                </div>
            </div>
        </a>
    </li>
{{/each}}
{{else}}
<li >{{transl 'common_null_data'}}</li>
{{/if}}
</ul>
