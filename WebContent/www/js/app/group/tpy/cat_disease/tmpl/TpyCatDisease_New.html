<div class="card">
    <div class="card-body">
        <h4 class="card-title">{{transl 'tpy_cat_disease_new_title'}}</h4>
        <div class="needs-validation" id="frm_new_group">
        	<input type="hidden" data-name="typ01" class="form-control objData" value="300">
        	<input type="hidden" data-name="stat" class="form-control objData" value="1">
           
           	
           	<div class="row">
           		<div class="col-3 form-group mb-2 mt-2">	
		            <div class="form-group">
		                <label for="inp_group_name">{{transl 'tpy_cat_disease_code'}}</label>
		                <input type="text" data-name="name" class="form-control objData" id="inp_group_name" value="{{name}}" placeholder="{{transl 'tpy_cat_disease_code_enter'}}" data-validation="required">
					</div>
		        </div>
            	<div class="col-9 form-group mb-2 mt-2">	
		            <div class="form-group">
		                <label for="inp_group_locate">{{transl 'tpy_cat_disease_name'}}</label>
		                <input type="text" data-group="inf01" data-name="room" class="form-control objData" id="inp_group_locate" value="{{inf01.room}}" placeholder="{{transl 'tpy_cat_disease_name_enter'}}" data-validation="">
					</div>
		        </div>
	        </div>
	        
        	<div class="col-lg-12 mt-4" id="div_create_describe">
				<label for="describe" class="col-form-label" style="font-weight: bold;">{{transl 'tpy_cat_disease_describe'}}</label>
				<div class="">
				    <textarea class="form-control objData" data-group="inf01" data-name="describe" id="introduce" rows="5" placeholder="{{transl 'tpy_cat_disease_describe'}}" data-validation="">{{inf01.introduce}}</textarea>
				</div>
           	</div>
           	
           	<div class="col-lg-12 mt-4" id="div_create_reason">
				<label for="reason" class="col-form-label" style="font-weight: bold;">{{transl 'tpy_cat_disease_reason'}}</label>
				<div class="">
				    <textarea class="form-control objData" data-group="inf02" data-name="reason" id="service" rows="5" placeholder="{{transl 'tpy_cat_disease_reason'}}" data-validation="">{{inf02.service}}</textarea>
				</div>
           	</div>
           	
  			<div class="col-lg-12 mt-4" id="div_create_symptom">
				<label for="symptom" class="col-form-label" style="font-weight: bold;">{{transl 'tpy_cat_disease_symptom'}}</label>
				<div class="">
				    <textarea class="form-control objData" data-group="inf02" data-name="symptom" id="mission" rows="5" placeholder="{{transl 'tpy_cat_disease_symptom'}}" data-validation="">{{inf02.mission}}</textarea>
				</div>
           	</div>
           	 
           	<div class="col-lg-12 mt-4" id="div_create_transmission">
				<label for="transmission" class="col-form-label" style="font-weight: bold;">{{transl 'tpy_cat_disease_transmission'}}</label>
				<div class="">
				    <textarea class="form-control objData" data-group="inf02" data-name="transmission" id="information" rows="5" placeholder="{{transl 'tpy_cat_disease_transmission'}}" data-validation="">{{inf02.information}}</textarea>
				</div>
           	</div>
           	
           	<div class="col-lg-12 mt-4" id="div_create_subjects">
				<label for="subjects" class="col-form-label" style="font-weight: bold;">{{transl 'tpy_cat_disease_subjects'}}</label>
				<div class="">
				    <textarea class="form-control objData" data-group="inf01" data-name="subjects" id="introduce" rows="5" placeholder="{{transl 'tpy_cat_disease_describe'}}" data-validation="">{{inf01.introduce}}</textarea>
				</div>
           	</div>
           	
           	<div class="col-lg-12 mt-4" id="div_create_prevent">
				<label for="prevent" class="col-form-label" style="font-weight: bold;">{{transl 'tpy_cat_disease_prevent'}}</label>
				<div class="">
				    <textarea class="form-control objData" data-group="inf02" data-name="prevent" id="service" rows="5" placeholder="{{transl 'tpy_cat_disease_prevent'}}" data-validation="">{{inf02.service}}</textarea>
				</div>
           	</div>
           	
  			<div class="col-lg-12 mt-4" id="div_create_diagnose">
				<label for="diagnose" class="col-form-label" style="font-weight: bold;">{{transl 'tpy_cat_disease_diagnose'}}</label>
				<div class="">
				    <textarea class="form-control objData" data-group="inf02" data-name="diagnose" id="mission" rows="5" placeholder="{{transl 'tpy_cat_disease_diagnose'}}" data-validation="">{{inf02.mission}}</textarea>
				</div>
           	</div>
           	 
           	<div class="col-lg-12 mt-4" id="div_create_treatment">
				<label for="treatment" class="col-form-label" style="font-weight: bold;">{{transl 'tpy_cat_disease_treatment'}}</label>
				<div class="">
				    <textarea class="form-control objData" data-group="inf02" data-name="treatment" id="information" rows="5" placeholder="{{transl 'tpy_cat_disease_treatment'}}" data-validation="">{{inf02.information}}</textarea>
				</div>
           	</div>   
	        
            <div class="d-flex justify-content-end mt-4">
            	<button id="btn_canel_group" class="btn" type="button">{{transl 'tpy_cat_disease_new_btn_cancel'}}</button>
			    <button id="btn_create_group" class="btn btn-primary" type="button">{{transl 'tpy_cat_disease_new_btn_save'}}</button>
			</div>
        </div>
    </div>
</div>
