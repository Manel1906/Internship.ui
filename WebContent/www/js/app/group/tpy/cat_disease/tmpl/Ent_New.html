<div class="card">
    <div class="card-body">
        <div class="row">
        	{{#if edit}}
        	<div class="col-lg-11 col-md-10 col-sm-9"><h5>{{transl 'tpy_cat_disease_edit_title'}}</h5></div>
        	{{else}}
            <div class="col-lg-11 col-md-10 col-sm-9"><h5>{{transl 'common_btn_new_title'}}</h5></div>
             {{/if}}
        	<div class="col-lg-1 col-md-2 col-sm-3 text-center"><i id="cancel_header" class="mdi mdi-window-close cursor-pointer" style="font-size: 20px; color: red;"></i></div>
        </div>
        <div class="needs-validation" id="frm_new_group">
        	<input type="hidden" data-name="typ01" class="form-control objData" value="300">
        	<input type="hidden" data-name="stat" class="form-control objData" value="1">
           
           <div><hr class="badge-info" style="height: 1px; width: 100%;"></div>
           	
            <div class="row">
           		<div class="col-4 form-group mb-2 mt-2">	
		            <div class="form-group">
		                <label for="inp_group_name">{{transl 'tpy_cat_disease_code'}}</label>
		                {{#if edit}}
			        	<input type="text" data-name="code" class="form-control objData" id="inp_group_name" value="{{code}}" placeholder="{{transl 'tpy_cat_disease_code_enter'}}" data-validation="required" readonly maxlength="50">
			        	{{else}}
		                <input type="text" data-name="code" class="form-control objData" id="inp_group_name" value="{{code}}" placeholder="{{transl 'tpy_cat_disease_code_enter'}}" data-validation="required" maxlength="50">
			             {{/if}}
					</div>
		        </div>
            	<div class="col-4 form-group mb-2 mt-2">	
		            <div class="form-group">
		                <label for="inp_group_locate">{{transl 'tpy_cat_disease_name'}}</label>
		                <input type="text" data-name="name" class="form-control objData" id="inp_group_locate" value="{{name}}" placeholder="{{transl 'tpy_cat_disease_name_enter'}}" data-validation="required" maxlength="150">
					</div>
		        </div>
		        <div class="col-4 form-group mb-2 mt-2">	
		            <div class="form-group">
		                <label for="inp_group_locate">{{transl 'tpy_cat_disease_name'}} (ENG)</label>
		                <input type="text" data-group="inf" data-name="nameEng" class="form-control objData" id="inp_group_locate" value="{{inf.nameEng}}" placeholder="{{transl 'tpy_cat_disease_name_enter'}}" data-validation="required" maxlength="150">
					</div>
		        </div>
	        </div>
	        <div class="row">
	        	<div class="col-lg-12 mt-4" id="div_create_describe">
					<label for="describe" class="col-form-label" style="font-weight: bold;">{{transl 'tpy_cat_disease_describe'}}</label>
					<div class="">
					    <textarea class="form-control objData" data-group="inf" data-name="describe" id="describe" rows="5" placeholder="{{transl 'tpy_cat_disease_describe'}}" data-validation="">{{inf.describe}}</textarea>
					</div>
	           	</div>
	           	
	           	<div class="col-lg-12 mt-4" id="div_create_reason">
					<label for="reason" class="col-form-label" style="font-weight: bold;">{{transl 'tpy_cat_disease_reason'}}</label>
					<div class="">
					    <textarea class="form-control objData" data-group="inf" data-name="reason" id="reason" rows="5" placeholder="{{transl 'tpy_cat_disease_reason'}}" data-validation="">{{inf.reason}}</textarea>
					</div>
	           	</div>
	           	
	  			<div class="col-lg-12 mt-4" id="div_create_symptom">
					<label for="symptom" class="col-form-label" style="font-weight: bold;">{{transl 'tpy_cat_disease_symptom'}}</label>
					<div class="">
					    <textarea class="form-control objData" data-group="inf" data-name="symptom" id="symptom" rows="5" placeholder="{{transl 'tpy_cat_disease_symptom'}}" data-validation="">{{inf.symptom}}</textarea>
					</div>
	           	</div>
	           	 
	           	<div class="col-lg-12 mt-4" id="div_create_transmission">
					<label for="transmission" class="col-form-label" style="font-weight: bold;">{{transl 'tpy_cat_disease_transmission'}}</label>
					<div class="">
					    <textarea class="form-control objData" data-group="inf" data-name="transmission" id="transmission" rows="5" placeholder="{{transl 'tpy_cat_disease_transmission'}}" data-validation="">{{inf.transmission}}</textarea>
					</div>
	           	</div>
	           	
	           	<div class="col-lg-12 mt-4" id="div_create_subjects">
					<label for="subjects" class="col-form-label" style="font-weight: bold;">{{transl 'tpy_cat_disease_subjects'}}</label>
					<div class="">
					    <textarea class="form-control objData" data-group="inf" data-name="subjects" id="subjects" rows="5" placeholder="{{transl 'tpy_cat_disease_describe'}}" data-validation="">{{inf.subjects}}</textarea>
					</div>
	           	</div>
	           	
	           	<div class="col-lg-12 mt-4" id="div_create_prevent">
					<label for="prevent" class="col-form-label" style="font-weight: bold;">{{transl 'tpy_cat_disease_prevent'}}</label>
					<div class="">
					    <textarea class="form-control objData" data-group="inf" data-name="prevent" id="prevent" rows="5" placeholder="{{transl 'tpy_cat_disease_prevent'}}" data-validation="">{{inf.prevent}}</textarea>
					</div>
	           	</div>
	           	
	  			<div class="col-lg-12 mt-4" id="div_create_diagnose">
					<label for="diagnose" class="col-form-label" style="font-weight: bold;">{{transl 'tpy_cat_disease_diagnose'}}</label>
					<div class="">
					    <textarea class="form-control objData" data-group="inf" data-name="diagnose" id="diagnose" rows="5" placeholder="{{transl 'tpy_cat_disease_diagnose'}}" data-validation="">{{inf.diagnose}}</textarea>
					</div>
	           	</div>
	           	 
	           	<div class="col-lg-12 mt-4" id="div_create_treatment">
					<label for="treatment" class="col-form-label" style="font-weight: bold;">{{transl 'tpy_cat_disease_treatment'}}</label>
					<div class="">
					    <textarea class="form-control objData" data-group="inf" data-name="treatment" id="treatment" rows="5" placeholder="{{transl 'tpy_cat_disease_treatment'}}" data-validation="">{{inf.treatment}}</textarea>
					</div>
	           	</div>   
			</div>
			
			<div class="d-flex justify-content-end mt-4">
           		<button id="btn_cancel_entity" class="btn" type="button">{{transl 'common_btn_cancel'}}</button>
		    	<button id="btn_create_entity" class="btn btn-primary" type="button">{{transl 'common_btn_save'}}</button>
			</div>
        </div>
    </div>
</div>
