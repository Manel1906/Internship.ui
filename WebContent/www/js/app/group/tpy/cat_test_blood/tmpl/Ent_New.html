<div class="card">
    <div class="card-body">
     	<div class="row">
	       	{{#if edit}}
	       	<div class="col-lg-11 col-md-10 col-sm-9"><h4>{{transl 'tpy_cat_disease_edit_title'}}</h4></div>
	       	{{else}}
	        <div class="col-lg-11 col-md-10 col-sm-9"><h4>{{transl 'common_btn_new_title'}}</h4></div>
	        {{/if}}
	        <div class="col-lg-1 col-md-2 col-sm-3 text-center"><i id="cancel_header" class="mdi mdi-window-close cursor-pointer" style="font-size: 20px; color: red;"></i></div>
        </div>
        <div class="needs-validation" id="frm_new_group">
        	<input type="hidden" data-name="typ01" class="form-control objData" value="2000">
        	<input type="hidden" data-name="stat" class="form-control objData" value="1">
           
           <div><hr class="badge-info" style="height: 1px; width: 100%;"></div>
           	
           	<div class="row">
				<div class="col-12 mt-1">	
		            <div class="form-group">
 						<label for="inp_group_name_1">{{transl 'tpy_cat_test_name'}}</label>
			        	<input type="text" data-name="name" class="form-control objData" id="inp_group_name_1" value="{{name}}" placeholder="{{transl 'tpy_cat_disease_name_enter'}}" data-validation="required">
					</div>	
		        </div>
			    <div class="col-3 mb-2 mt-2">	
			        <label for="inp_group_name_2">{{transl 'tpy_cat_test_code'}}</label>
			        <input type="text" data-name="code" class="form-control objData" id="inp_group_name_2" value="{{code}}" placeholder="{{transl 'tpy_cat_disease_code_enter'}}" data-validation="required">
			    </div>
			
			    <div class="col-3 mb-2 mt-2">	
			        <label for="inp_group_select">{{transl 'tpy_cat_test_group'}}</label>
			        <select id="inp_group_select" class="form-control objData content-edit isManager" data-group="inf" data-name="statGrp">
			            <option {{#equal typ03 1}}selected{{/equal}} value="1">{{transl 'aut_test_ent_header_stat_1'}}</option>
			            <option {{#equal typ03 2}}selected{{/equal}} value="2">{{transl 'aut_test_ent_header_stat_2'}}</option>
			            <option {{#equal typ03 3}}selected{{/equal}} value="3">{{transl 'aut_test_ent_header_stat_3'}}</option>
			            <option {{#equal typ03 4}}selected{{/equal}} value="4">{{transl 'aut_test_ent_header_stat_4'}}</option>
			            <option {{#equal typ03 10}}selected{{/equal}} value="10">{{transl 'aut_test_ent_header_stat_10'}}</option>
			        </select>
			    </div>
			
			    <div class="col-3 mb-2 mt-2">	
			        <label for="inp_group_name_3">{{transl 'tpy_cat_test_room'}}</label>
			        <input type="text" data-group="inf" data-name="room" class="form-control objData" id="inp_group_name_3" value="{{inf.room}}" placeholder="{{transl 'tpy_cat_disease_room_enter'}}" data-validation="required">
			    </div>
			
			    <div class="hide col-4 mb-2 mt-2">	
			        <label for="inp_group_name_4">{{transl 'tpy_cat_test_time'}}</label>
			        <input type="text" data-group="inf" data-name="time" class="form-control objData" id="inp_group_name_4" value="{{inf.time}}" placeholder="{{transl 'tpy_cat_disease_time_enter'}}" data-validation="required">
			    </div>
			
			    <div class="col-3 mb-2 mt-2">	
			        <label for="inp_group_select_2">{{transl 'tpy_cat_test_unit'}}</label>
			        <select id="inp_group_select_2" class="form-control objData content-edit isManager" data-group="inf" data-name="statUnit">
			            <option {{#equal stat 3}}selected{{/equal}} value="3">{{transl 'aut_test_unit_header_stat_3'}}</option>
			            <option {{#equal stat 4}}selected{{/equal}} value="4">{{transl 'aut_test_unit_header_stat_4'}}</option>
			            <option {{#equal stat 5}}selected{{/equal}} value="5">{{transl 'aut_test_unit_header_stat_5'}}</option>
			            <option {{#equal stat 6}}selected{{/equal}} value="6">{{transl 'aut_test_unit_header_stat_6'}}</option>
			            <option {{#equal stat 10}}selected{{/equal}} value="10">{{transl 'aut_test_unit_header_stat_10'}}</option>
			        </select>
			    </div>
			</div>

	        <div class="row">
        	<div class="col-lg-12 mt-4" id="div_create_describe">
				<label for="describe" class="col-form-label" style="font-weight: bold;">{{transl 'tpy_test_describe'}}</label>
				<div class="">
				    <textarea class="form-control objData" data-group="inf" data-name="describe" id="describe" rows="5" placeholder="{{transl 'tpy_test_describe'}}" data-validation="">{{inf.describe}}</textarea>
				</div>
           	</div>
           	
           	<div class="col-lg-12 mt-4" id="div_create_reason">
				<label for="reason" class="col-form-label" style="font-weight: bold;">{{transl 'tpy_test_procedure'}}</label>
				<div class="">
				    <textarea class="form-control objData" data-group="inf" data-name="procedure" id="reason" rows="5" placeholder="{{transl 'tpy_test_procedure'}}" data-validation="">{{inf.procedure}}</textarea>
				</div>
           	</div>
           	
  			<div class="col-lg-12 mt-4" id="div_create_symptom">
				<label for="symptom" class="col-form-label" style="font-weight: bold;">{{transl 'tpy_test_required'}}</label>
				<div class="">
				    <textarea class="form-control objData" data-group="inf" data-name="required" id="symptom" rows="5" placeholder="{{transl 'tpy_test_required'}}" data-validation="">{{inf.required}}</textarea>
				</div>
           	</div>
	        </div>
	        
            <div class="d-flex justify-content-end mt-4">
            	<button id="btn_cancel_entity" class="btn" type="button">{{transl 'common_btn_cancel'}}</button>
			    <button id="btn_create_entity" class="btn btn-primary" type="button">{{transl 'common_btn_save'}}</button>
			</div>
        </div>
    </div>
</div>
