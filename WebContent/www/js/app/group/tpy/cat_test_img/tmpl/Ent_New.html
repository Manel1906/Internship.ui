<div class="card">
    <div class="card-body">
     	<div class="row">
	        {{#if edit}}
	       	<div class="col-lg-11 col-md-10 col-sm-9"><h4>{{transl 'tpy_cat_disease_edit_title'}}</h4></div>
	       	{{else}}
	        <div class="col-lg-11 col-md-10 col-sm-9"><h4>{{transl 'common_btn_new_title'}}</h4></div>
	        {{/if}}
	        <div class="col-lg-1 col-md-2 col-sm-3 text-center"><i id="cancel_header" class="mdi mdi-window-close cursor-pointer" style="font-size: 20px; color: red;"></i></div>
         </div>
        <div class="needs-validation" id="frm_new_group">
        	<input type="hidden" data-name="typ01" class="form-control objData" value="3000">
        	<input type="hidden" data-name="stat" class="form-control objData" value="1">
           
           <div><hr class="badge-info" style="height: 1px; width: 100%;"></div>
           	
           	<div class="row">
           		<div class="col-12 mt-2">	
		            <div class="form-group">
		            	 <label for="inp_group_name_1">{{transl 'tpy_test_img_name'}}<span class="required">&nbsp;*</span></label>
		                <input type="text" data-name="name" class="form-control objData" id="inp_group_name" value="{{name}}" placeholder="{{transl 'prj_test_img_name'}}" data-validation="required">
					</div>	
		        </div>
		        
			    <div class="col-4 mb-2 mt-2">	
			        <label for="inp_group_name_1">{{transl 'tpy_test_img_code'}}<span class="required">&nbsp;*</span></label>
			        <input type="text" data-name="code" class="form-control objData" id="inp_group_name_1" value="{{code}}" placeholder="{{transl 'prj_test_img_code'}}" data-validation="required">
			    </div>
			
			    <div class="col-4 mb-2 mt-2">	
			        <label for="inp_group_select">{{transl 'tpy_test_img_group'}}</label>
			        <select id="inp_group_select" class="form-control objData content-edit isManager" data-name="typ03">
			            <option {{#equal inf.statGrp 1}}selected{{/equal}} value="1">{{transl 'aut_test_ent_header_stat_1'}}</option>
			            <option {{#equal inf.statGrp 2}}selected{{/equal}} value="2">{{transl 'aut_test_ent_header_stat_2'}}</option>
			            <option {{#equal inf.statGrp 3}}selected{{/equal}} value="3">{{transl 'aut_test_ent_header_stat_3'}}</option>
			            <option {{#equal inf.statGrp 4}}selected{{/equal}} value="4">{{transl 'aut_test_ent_header_stat_4'}}</option>
			            <option {{#equal inf.statGrp 10}}selected{{/equal}} value="10">{{transl 'aut_test_ent_header_stat_10'}}</option>
			        </select>
			    </div>
			
			    <div class="col-4 mb-2 mt-2">	
			        <label for="inp_group_name_4">{{transl 'tpy_test_img_room'}}<span class="required">&nbsp;*</span></label>
			        <input type="text" data-group="inf" data-name="room" class="form-control objData" id="inp_group_name_4" value="{{inf.room}}" placeholder="{{transl 'tpy_test_img_room_enter'}}" data-validation="required">
			    </div>
			</div>

	        <div class="row">
        	<div class="col-lg-12 mt-4" id="div_create_describe">
				<label for="describe" class="col-form-label" style="font-weight: bold;">{{transl 'tpy_test_describe'}}</label>
				<div class="">
				    <textarea class="form-control objData" data-group="inf" data-name="describe" id="describe" rows="5" placeholder="{{transl 'tpy_test_describe'}}" data-validation="">{{inf.describe}}</textarea>
				</div>
           	</div>
           	
  			<div class="col-lg-12 mt-4" id="div_create_symptom">
				<label for="symptom" class="col-form-label" style="font-weight: bold;">{{transl 'tpy_test_required'}}</label>
				<div class="">
				    <textarea class="form-control objData" data-group="inf" data-name="required" id="symptom" rows="5" placeholder="{{transl 'tpy_test_required'}}" data-validation="">{{inf.required}}</textarea>
				</div>
           	</div>
	        </div>
            <div class="d-flex justify-content-end mt-4">
            	<button id="btn_cancel_entity" class="btn" type="button">{{transl 'common_btn_cancel'}}</button>
			    <button id="btn_create_entity" class="btn btn-primary" type="button">{{transl 'common_btn_save'}}</button>
			</div>
        </div>
    </div>
</div>
