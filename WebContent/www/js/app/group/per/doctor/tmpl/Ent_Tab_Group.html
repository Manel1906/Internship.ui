<div class="card">
   <div class="card-body">
	   	<div class="media">
	   		<div class="col-sm-5">
	   			<h4 class="card-title mb-4 media-body">{{transl 'prj_project_speciality'}}</h4>
	   		</div>
	   		<div class="col-sm-7">
	             <div class="text-right font-size-20">
	                <i id="btn_add_specialty" class="mdi mdi-pencil-outline text-success cursor-pointer isManager mr-1" style="font-size: 20px;"></i>
	             	<a id="a_btn_save_speciality" class="mr-2 text-primary hide action-mem action-item-member" data-toggle="tooltip" data-placement="top" title="" data-original-title="Save">
		            	<i class="mdi mdi-content-save action-item"></i>
		            </a>
		            <a id="a_btn_cancel_speciality" class="mr-2 text-danger hide action-mem action-item-member" data-toggle="tooltip" data-placement="top" title="" data-original-title="Cancel">
		            	<i class="mdi mdi-close"></i>
		            </a>
		            <a data-divtoggle="#tabMember" class="btn-resize_grp" data-toggle="tooltip" data-placement="top" title="" data-original-title="Resize">
		            	 <i class="mdi mdi-window-minimize  cursor-pointer"></i>
		            </a>
	             </div>
	         </div>
		</div>
        <div id="tabMember" class="table-responsive">
		    <table class="table table-centered table-nowrap">
		        <tbody>
		            {{#each this}}
		               <tr>
					    <td class="hide d-flex align-items-center btn-remove-speci cursor-pointer" data-memid="{{id}}" style="width: 10%;">
					        <a class='text-danger' data-toggle='tooltip' data-placement='top' title='' data-original-title='Delete'>
					            <i class='mdi mdi-close font-size-18'></i>
					        </a>
					    </td>
					    <td style="width: 90%;" class="cursor-pointer">
					        <h4 class="card-title media-body p-2 bg-light border rounded d-flex justify-content-center align-items-center">
					            {{name}}
					        </h4>
					    </td>
					 </tr>
		            {{/each}}
		        </tbody>
		    </table>
		</div>

        <div class="hide action-item-member isManager">
        	<div class="mb-3 row">
        		
	             <div class="col-md-12">
	                 <div class="mt-2 mt-md-0">
                       	<div class="col-md-12 d-flex align-items-center">
                           <input style="max-width: 200px;" type="text" id="inp_name_member" class="form-control inp-name-member_all" placeholder="{{transl 'prj_project_enter_name'}}" />
                           <div id="selected_members_all"></div>
	                 </div>
	             </div>
	             
<!--	             <div class="col-md-7">
			    	<input type="text" class="inner form-control ui-autocomplete-input" id="inp_name_member" placeholder="{{transl 'prj_project_enter_name'}}">
	        	</div> -->
        	</div>
        </div>
    </div>
</div>
