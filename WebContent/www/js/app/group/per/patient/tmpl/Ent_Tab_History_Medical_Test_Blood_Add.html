<tr>
	<td class="text-center">
		<input type="text" data-group="inf06" data-gindex="{{index}}" data-name="index" class="form-control objData inf-entity" autocomplete="off" value="{{index}}" data-validation="" readonly>
	</td>
	<td class="text-center">
		<input type="text" data-group="inf06" data-gindex="{{index}}" data-name="code" class="inp_code_service form-control objData inf-entity" autocomplete="off" value="{{code}}" data-validation="required">
		<div class="selected_code_service form-control d-flex justify-content-center align-items-center w-100 hide"></div>
	</td>
	<td class="text-center">
		<input type="text" data-group="inf06" data-gindex="{{index}}" data-name="name" class="inp_name form-control objData inf-entity" autocomplete="off" value="{{name}}" data-validation="required">
		<div class="selected_name form-control d-flex justify-content-center align-items-center w-100 hide"></div>
	</td>
	<td class="text-center">
		<input type="text" data-group="inf06" data-gindex="{{index}}" data-name="note" class="form-control objData inf-entity" autocomplete="off" value="{{note}}" data-validation="required">
	</td>
	<td class="text-center btnRemoveRowBlood">
		<button style="background: none; border: none; color: #007bff; font-size: 24px; cursor: pointer;">-</button>
	</td>
</tr>
