{{#if data}}
	{{#each data}}
       <div class="col-3 border p-2 text-center align-middle infor-get">
           <label for="inp_group_locate" class="mb-0">{{reqFormatShortDate dt01}}</label>
       </div>
       <div class="col-3 border p-2 text-center align-middle infor-get">
           <label class="edit-text info-show-family">
				{{#equal typ02 0}}{{transl "per_person_patient_hist_remote" }}{{/equal}}
				{{#equal typ02 1}}{{transl "per_person_patient_hist_live" }}{{/equal}}
		   </label>
       </div>
       <div class="col-4 border p-2 text-center align-middle infor-get">
           <label for="inp_group_locate" class="mb-0">{{inf09}}</label>
       </div>
       <div class="col-2 border p-2 text-center align-middle infor-get cursor-pointer">
          <span class="mdi mdi-eye-outline"></span>
       </div>
     {{/each}}
{{else}}
<li >{{transl 'common_null_data'}}</li>
{{/if}}
