<tr>
	<td class="text-center" style="min-width: 60px;">
		<input type="text" data-group="inf05" data-gindex="{{index}}" data-name="index" class="form-control objData inf-entity" autocomplete="off" id="inp_group_code" value="{{index}}" data-validation="" readonly>
	</td>
	<td class="text-center" style="min-width: 150px;">
		<input type="text" data-group="inf05" data-gindex="{{index}}" data-name="pharma" class="inp_pharmaceuticals form-control objData inf-entity" autocomplete="off"  value="{{pharma}}" data-validation="required">
		<div class="form-control d-flex justify-content-center align-items-center w-100 hide"></div>
		<div class="selected_medicine form-control d-flex justify-content-center align-items-center w-100 hide"></div>
	</td>
	<td class="text-center" style="min-width: 180px;">
		<input type="text" data-group="inf05" data-gindex="{{index}}" data-name="ingre" class="inp_ingre form-control objData inf-entity" autocomplete="off"  value="{{ingre}}" data-validation="required">
		<div class="selected_ingre form-control d-flex justify-content-center align-items-center w-100 hide"></div>
	</td>
	<td class="text-center" style="min-width: 100px;">
		<input type="text"  data-group="inf05" data-gindex="{{index}}" data-name="code" class="inp_code form-control objData inf-entity" autocomplete="off"  value="{{code}}" data-validation="required">
		<div class="selected_code form-control d-flex justify-content-center align-items-center w-100 hide"></div>
	</td>
	<td class="text-center" style="min-width: 100px;">
		<input type="text" data-group="inf05" data-gindex="{{index}}" data-name="dvt" class="form-control objData inf-entity" autocomplete="off" value="{{dvt}}" data-validation="required">
	</td>
	<td class="text-center" style="min-width: 70px;">
		<input id="number_morning" type="text" data-group="inf05" data-gindex="{{index}}" data-name="morning" class="form-control objData inf-entity" autocomplete="off" value="{{morning}}">
	</td>
	<td class="text-center" style="min-width: 70px;">
		<input id="number_lunch" type="text" data-group="inf05" data-gindex="{{index}}" data-name="lunch" class="form-control objData inf-entity" autocomplete="off" value="{{lunch}}">
	</td>
	<td class="text-center" style="min-width: 70px;">
		<input id="number_afternoon" type="text" data-group="inf05" data-gindex="{{index}}" data-name="afternoon" class="form-control objData inf-entity" autocomplete="off" value="{{afternoon}}" >
	</td>
	<td class="text-center" style="min-width: 70px;">
		<input id="number_dark" type="text" data-group="inf05" data-gindex="{{index}}" data-name="dark" class="form-control objData inf-entity" autocomplete="off" value="{{dark}}">
	</td>
	<td class="text-center" style="min-width: 80px;">
		<input id="number_day" type="text" data-group="inf05" data-gindex="{{index}}" data-name="nbDay" class="form-control objData inf-entity" autocomplete="off" value="{{nbDay}}">
	</td>
	<td class="text-center" style="min-width: 90px;">
		<input id="total" type="text" data-group="inf05" data-gindex="{{index}}" data-name="total" class="form-control objData inf-entity" autocomplete="off" value="{{total}}" readonly>
	</td>
	<td class="text-center" style="min-width: 100px;">
		<input type="text" data-group="inf05" data-gindex="{{index}}" data-name="sugar" class="form-control objData inf-entity" autocomplete="off" value="{{sugar}}" data-validation="required">
	</td>
	<td class="text-center" style="min-width: 150px;">
		<input type="text" data-group="inf05" data-gindex="{{index}}" data-name="note" class="form-control objData inf-entity" autocomplete="off" value="{{note}}">
	</td>
	<td class="text-center btnRemoveRowPrescription">
		<button style="background: none; border: none; color: #007bff; font-size: 24px; cursor: pointer;">-</button>
	</td>
</tr>
