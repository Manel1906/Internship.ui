<div class="card col-12">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <a id="a_btn_save" class="mr-2 text-primary hide action-item action-item-duplicate" data-toggle="tooltip" data-placement="top" title="Save">
                    <i class="mdi mdi-content-save font-size-20 action-item"></i>
                </a>
                <a id="a_btn_cancel" class="mr-2 text-danger hide action-item-duplicate cursor-pointer" data-toggle="tooltip" data-placement="top" title="Cancel">
                    <i class="mdi mdi-close font-size-20"></i>
                </a>
            </div>
            <div class="dropdown font-size-20">
                <div class="col-lg-1 col-md-2 col-sm-3 text-center mr-3"><i id="btn_cancel_new_01" class="mdi mdi-window-close cursor-pointer" style="font-size: 20px; color: red;"></i></div>
<!--                 <a data-divtoogle="#div_group_content" class="btn-resize-content cursor-pointer" data-toggle="tooltip" data-placement="top" title="Resize"> -->
<!--                     <i class="mdi mdi-window-minimize text-primary"></i> -->
<!--                 </a> -->
            </div>
        </div>
       <div class="needs-validation" id="frm_new_group">
            <input type="hidden" data-name="typ01" class="form-control objData" value="100">
            <input type="hidden" data-name="stat" class="form-control objData" value="1">
            
            <div class="row mb-4">
                <div class="col-4 d-flex justify-content-center align-items-center">
            <!--     <img src="{{avatar.url}}" style="object-fit: cover" alt="" class="img-fluid rounded-circle" onerror="{{url_image_err}}">  --> 
					<img 
					        src="{{avatar.url}}" 
					        style="width: 120px; height: 110px; object-fit: cover; border-radius: 50%;" 
					        class="avatar-xs" 
					        alt="Avatar" 
					        onerror="{{url_image_err}}">
                </div>
                <div class="col-8">
                 	<div class="row">
	                    <div class="form-group col-4">
                            <label for="inp_group_phone">{{transl 'per_person_patient_producer_fullname'}}<span class="required">&nbsp;*</span></label>
                            <input type="text"  data-name="name01" class="form-control objData" id="inp_group_phone" value="{{name01}}" maxlength="250" data-validation="required">
                        </div>
                      	<div class="form-group col-4">
                            <label for="inp_group_phone">{{transl 'per_person_patient_producer_fullname_foreign'}}</label>
                            <input type="text"  data-name="name03" class="form-control objData" id="inp_group_phone" value="{{name03}}" maxlength="250">
                        </div>
                 	</div>
            	</div>
            </div>
            
            <hr class="badge-info" style="height: 1px;">
            
            <div class="row ml-1 mt-2">
            	<div class="form-group col-4">
                   	<label for="inp_group_phone">{{transl 'per_person_patient_code'}}<span class="required">&nbsp;*</span></label>
                    <input type="text"  data-name="code01" class="form-control objData" id="inp_group_phone" value="{{code01}}" maxlength="50" data-validation="required">
            	</div>
            	<div class="form-group col-4">
					<label>{{transl 'per_person_patient_mst'}}<span class="required">&nbsp;*</span></label>
					<input type="text" data-name="code02" class="form-control objData" id="inp_group_email" value="{{code02}}" maxlength="250" data-validation="required">
				</div>
            	<div class="form-group col-4">
                   	<label >{{transl 'per_person_social_code'}}<span class="required">&nbsp;*</span></label>
                    <input type="text"  data-name="code05" class="form-control objData" id="inp_group_phone" value="{{code05}}" maxlength="50" >
            	</div>			
            	
			</div>
                
			<div class="row ml-1">
				<div class="col-4">
					<label>{{transl 'prj_user_group_status'}} <span class="required">&nbsp;*</span></label>
					<select id="sel_autuser_header_legalstat" class="form-control objData content-edit isManager" data-validation="" data-name="inf10">
							<option {{#equal inf10 1}}selected{{/equal}} value="0">{{transl "aut_user_ent_header_producer_stat_1"}}</option>
							<option {{#equal inf10 5}}selected{{/equal}} value="1">{{transl "aut_user_ent_header_producer_stat_5"}}</option>
							<option {{#equal inf10 10}}selected{{/equal}} value="2">{{transl "aut_user_ent_header_producer_stat_10"}}</option>
					</select>
				</div>
				<div class="col-4">
					<label>{{transl 'per_person_produce_start_date'}}<span class="required">&nbsp;*</span></label>
					<div class="input-daterange form-group  content-edit">
						<input id="inp_autuser_tab01_birthday" data-provide="datepicker" autocomplete="off" class="form-control objData content-edit isManager" type="text"
			            	data-name="dt03" data-format="date" data-validation="date" {{#if dt03}}value="{{reqFormatShortDate dt03}}"{{/if}}>
					</div>
				</div>
				<div class="form-group col-4">
                   	<label>{{transl 'per_person_patient_type_produce'}}<span class="required">&nbsp;*</span></label>
                   	<input type="text"  data-name="inf03" class="form-control objData" id="inp_group_locate" value="{{inf03}}"  maxlength="250">
				</div>
			</div>
			
            <div class="row ml-1">
				<div class="form-group col-6">
	                <label>{{transl 'prj_user_group_nationality'}}<span class="required">&nbsp;*</span></label>
	                <input type="text"  data-group="inf04" data-name="n" class="form-control objData" id="inp_group_locate" value="{{inf04.n}}"  maxlength="250">
                </div>
                <div class="form-group col-6">
	                <label for="inp_group_name">{{transl 'per_person_patient_address'}}<span class="required">&nbsp;*</span></label> 
	                <input type="text" data-group="inf04" data-name="a" class="form-control objData" id="inp_group_name" value="{{inf04.a}}" placeholder="{{transl 'prj_tpy_group_address_enter'}}">
				</div>	
	        </div>
	        
      		<div class="row ml-1">
				<div class="form-group col-6">
					<label>{{transl 'per_person_patient_phone'}}<span class="required">&nbsp;*</span></label>
					<input type="text" data-name="inf02" class="form-control objData" id="inp_group_email" value="{{inf02}}" maxlength="50" data-validation="required">
				</div>
				<div class="form-group col-6">
					<label>{{transl 'per_person_patient_mail'}}<span class="required">&nbsp;*</span></label>
					<input type="email" data-name="inf01" class="form-control objData" id="inp_group_email" value="{{inf01}}" maxlength="250" data-validation="required">
				</div>
			</div>

            <hr class="badge-info" style="height: 1px;">
            
            
			<div class="row mt-4">
            	<div class="col-lg-6 col-md-4 col-sm-12 col-xm-12 form-group mb-4">
					<label for="inp_group_descr">{{transl 'prj_user_group_avatar'}}</label>
					<div id="frm_dropzone_send" class="fallback">

						<form action="/" method="post" class="dropzone inputfile">
							<div class="fallback">
								<input data-name="files" type="file" class="objData" data-typ01="1" data-typ02="1">
							</div>
		
							<div class="dz-message needsclick">
								<div class="mb-3">
									<i class="display-4 text-muted bx bxs-cloud-upload"></i>
								</div>
								<h4>{{transl 'prj_project_drop_files'}}</h4>
							</div>
						</form>
					</div>
				</div>
				
				<div class="col-lg-6 col-md-4 col-sm-12 col-xm-12 form-group mb-4">
					<label for="inp_group_descr">{{transl 'prj_user_group_files'}}</label>
					<div id="frm_dropzone_send_file" class="fallback">

						<form action="/" method="post" class="dropzone inputfile">
							<div class="fallback">
								<input data-name="files" type="file" class="objData" data-typ01="2" data-typ02="10" multiple>
							</div>

							<div class="dz-message needsclick">
								<div class="mb-3">
									<i class="display-4 text-muted bx bxs-cloud-upload"></i>
								</div>
								<h4>{{transl 'prj_project_drop_files'}}</h4>
							</div>
						</form>
					</div>
				</div>
	        </div> 
            <div class="d-flex justify-content-end mt-4">
                <button id="btn_cancel_new_02" class="btn btn-secondary mr-2" type="button">{{transl 'prj_user_group_new_btn_cancel'}}</button>
                <button id="btn_create_entity" class="btn btn-primary" type="button">{{transl 'prj_user_group_new_btn_save'}}</button>
            </div>
        </div>
    </div>
</div>
