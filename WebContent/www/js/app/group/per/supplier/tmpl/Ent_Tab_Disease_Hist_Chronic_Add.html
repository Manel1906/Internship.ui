<tr>
	<td class="text-center">
		<input type="text" data-group="inf01" data-gindex="{{index}}" data-name="index" class="form-control objData inf-entity" autocomplete="off" value="{{index}}" data-validation="" readonly>
	</td>
	<td class="text-center">
		<input type="text" data-group="inf01" data-gindex="{{index}}" data-name="disease" class="form-control objData inf-entity " autocomplete="off"  value="{{disease}}" placeholder="{{transl 'per_person_patient_hist_uni'}}" data-validation="required">
	</td>
	<td class="text-center">
		<input type="text" data-group="inf01" data-gindex="{{index}}" data-name="condition" class="form-control objData inf-entity " autocomplete="off"  value="{{condition}}" placeholder="{{transl 'per_person_patient_hist_condi'}}" data-validation="required">
	</td>
	<td class="text-center">
		<input type="text" data-group="inf01" data-gindex="{{index}}" data-name="note" class="form-control objData inf-entity " autocomplete="off"  value="{{note}}" placeholder="{{transl 'per_person_patient_hist_note'}}" data-validation="required">
	</td>
	<td class="text-center">
		<input type="text" data-group="inf01" data-gindex="{{index}}" data-name="docRealize" class="form-control objData inf-entity " autocomplete="off"  value="{{docRealize}}" placeholder="{{transl 'per_person_patient_hist_reliz'}}" data-validation="required">
	</td>
	<td class="text-center">
		<input data-group="inf01" data-gindex="{{index}}" data-name="dRealize" data-provide="datepicker" autocomplete="off" class="form-control objData inf-entity" type="text"
		placeholder="{{transl 'per_person_patient_hist_date_reliz'}}" data-format="date" data-validation="date required" {{#if dRealize}}value="{{reqFormatShortDate dRealize}}"{{/if}}>
	</td>
	<td class="text-center btnRemoveRow">
		<button style="background: none; border: none; color: #007bff; font-size: 24px; cursor: pointer;">-</button>
	</td>
</tr>
