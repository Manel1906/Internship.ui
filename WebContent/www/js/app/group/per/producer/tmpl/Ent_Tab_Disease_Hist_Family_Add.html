<tr>
	<td class="text-center">
		<input type="text" data-group="inf02" data-gindex="{{index}}" data-name="index" class="form-control objData inf-entity" autocomplete="off" id="inp_group_code" value="{{index}}" data-validation="" readonly>
	</td>
	<td class="text-center">
		<input type="text" data-group="inf02" data-gindex="{{index}}" data-name="disease" class="form-control objData inf-entity" autocomplete="off" id="inp_group_name" value="{{disease}}" placeholder="{{transl 'per_person_patient_hist_uni'}}" data-validation="required">
	</td>
	<td class="text-center">
		<select class="form-control objData inf-entity-family" data-gindex="{{@index}}" data-validation="required"  data-group="inf02" data-name="relate">
				<option value="0" selected>{{transl "per_person_patient_father"}}</option>
				<option value="1">{{transl "per_person_patient_mother"}}</option>
				<option value="2">{{transl "per_person_patient_child"}}</option>
				<option value="3">{{transl "per_person_patient_husband"}}</option>
				<option value="4">{{transl "per_person_patient_brother"}}</option>
				<option value="5">{{transl "per_person_patient_sister"}}</option>
				<option value="6">{{transl "per_person_patient_yger_sister"}}</option>
				<option value="7">{{transl "per_person_patient_grand"}}</option>
				<option value="8">{{transl "per_person_patient_wife"}}</option>
				<option value="9">{{transl "per_person_patient_another"}}</option>
		</select>
	</td>
	<td class="text-center">
		<input type="text" data-group="inf02" data-gindex="{{index}}" data-name="condition" class="form-control objData inf-entity" autocomplete="off" id="inp_group_name" value="{{condition}}" placeholder="{{transl 'per_person_patient_hist_condi'}}" data-validation="required">
	</td>
	<td class="text-center">
		<input type="text" data-group="inf02" data-gindex="{{index}}" data-name="note" class="form-control objData inf-entity" autocomplete="off" id="inp_group_locate" value="{{note}}" placeholder="{{transl 'per_person_patient_hist_note'}}" data-validation="required">
	</td>
	<td class="text-center">
		<input type="text" data-group="inf02" data-gindex="{{index}}" data-name="docRealize" class="form-control objData inf-entity" autocomplete="off" id="inp_group_locate" value="{{docRealize}}" placeholder="{{transl 'per_person_patient_hist_reliz'}}" data-validation="required">
	</td>
	<td class="text-center">
		<input data-group="inf02" data-gindex="{{index}}" data-name="dRealize" data-provide="datepicker" autocomplete="off" class="form-control objData inf-entity" type="text"
        placeholder="{{transl 'per_person_patient_hist_date_reliz'}}" data-format="date" data-validation="date" {{#if dRealize}}value="{{reqFormatShortDate dRealize}}"{{/if}} required>
	<td class="text-center btnRemoveRow">
		<button style="background: none; border: none; color: #007bff; font-size: 24px; cursor: pointer;">-</button>
	</td>
</tr>
