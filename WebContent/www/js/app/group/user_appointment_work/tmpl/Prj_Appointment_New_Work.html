<div class="card mb-0">
    <div class="card-body" id="div_create_prj_appointment">
        <div class="outer-repeater">
            <!-- Event Name -->
			<input type="hidden" class="objData" data-name="id" data-validation="number" value="{{ent.id}}">
			<div class="form-group mb-2">
                <div class="row">
                     <div class="col-6">
	                       <label for="typ02" for="scheduleType" class="col-form-label h5">{{transl 'prj_schedule_work_type'}}</label>
	                       <select data-name="typ02" id="typ02" class="form-control objData typ02"	>
								<option {{#equal ent.typ02 100}}selected{{/equal}} value="100" data-color="#d3d3d3">{{transl 'prj_appointment_option_zero'}}</option>
								<option {{#equal ent.typ02 200}}selected{{/equal}} value="200" data-color="#87cefa">{{transl 'prj_appointment_option_one'}}</option>
								<option {{#equal ent.typ02 300}}selected{{/equal}} value="300" data-color="#ffa500">{{transl 'prj_appointment_option_two'}}</option>
								<option {{#equal ent.typ02 400}}selected{{/equal}} value="400" data-color="#34c38f">{{transl 'prj_appointment_option_three'}}</option>
								<option {{#equal ent.typ02 500}}selected{{/equal}} value="500" data-color="#ffb6c1">{{transl 'prj_appointment_option_four'}}</option>
								<option {{#equal ent.typ02 600}}selected{{/equal}} value="600" data-color="#ffff99">{{transl 'prj_appointment_option_five'}}</option>
							</select>
							<input type="hidden" id="colorValue" data-group="inf02" data-name="cl" />
                        	</div>
                      <div class="col-6">
	                       <label for="department" class="col-form-label h5">{{transl 'prj_departments_level'}}</label>
		                    <input id="department_input_id" type="hidden" data-name="parId" class="form-control objData" disabled>
		                    <input id="department_input" type="text" class="form-control" disabled>
                       </div>
                    </div>
            </div>	            
			<div class="form-group row mb-2">
                 <div class="col-lg-12">
                     <label class="col-form-label h5">{{transl 'prj_appointment_title'}}</label>
                     <input data-name="name" type="text" class="form-control objData" value="{{ent.name}}">
                 </div>
             </div>
			<div class="form-group mb-2">
                <div class="row">
                	<div class="col-6">
                     	 <label for="location" class="col-form-label h5">{{transl 'prj_appointment_area'}}<span class="required">&nbsp;*</span></label>
	                     <input type="hidden" class="objData" data-name="lev" value="{{lev}}">
	                     <input id="cmt03" data-name="inf01" type="text" class="form-control objData" data-validation="required" value="{{ent.inf01}}">
                     </div>
                     <div class="col-6">
			             <label for="price" class="col-form-label h5">{{transl 'prj_appointment_price'}}<span class="required">&nbsp;*</span></label>
			             <input type="number" class="form-control objData" data-group="inf02" data-name="pr" id="price" value="{{ent.inf02.pr}}" data-validation="required">
                     </div>
                </div>
            </div>
            
			<div class="form-group row mb-2">
				<div class="col-lg-12">
					<label class="col-form-label h5">{{transl 'prj_project_project_date'}}<span class="required">&nbsp;*</span></label>
					<div class="input-daterange input-group">
						<input data-format="date" type="text" data-validation="date required"
                              class="form-control objData" id="dtpicker_Begin"
                              placeholder="{{transl 'prj_project_start_date'}}" data-group="dtBegin"
                              data-name="date" data-provide="datepicker"
                              data-date-format="dd/mm/yyyy"/>

						<input type="text" class="form-control objData tmpicker mr-4"
                              id="tmpicker_Begin" placeholder="{{transl 'prj_project_start_date'}}"
                              data-group="dtBegin" data-name="time" data-provide="timepicker" data-validation="required"/>

						<input data-format="date" type="text" data-validation="date required"
                              class="form-control objData" id="dtpicker_End"
                              placeholder="{{transl 'prj_project_end_date'}}" data-group="dtEnd"
                              data-name="date" data-provide="datepicker"
                              data-date-format="dd/mm/yyyy"/>

						<input type="text" class="form-control objData tmpicker" id="tmpicker_End"
                              placeholder="{{transl 'prj_project_end_date'}}" data-group="dtEnd"
                              data-name="time" data-provide="timepicker" data-validation="required"/>

					</div>
				</div>
			</div>
            <!-- Notes -->
            <div class="form-group row mb-2">
                <div class="col-lg-12">
                    <label for="projectdesc" class="col-form-label h5">{{transl 'prj_appointment_cmt'}}</label>
                    <textarea class="form-control objData" data-group="inf02" data-name="desc" id="projectdesc" rows="2">{{ent.inf02.desc}}</textarea>
                </div>
            </div>

			<div  class="form-group row mb-2 mod-repeat-hide">
				<div class="col-lg-6">
					<label class="col-form-label h5">{{transl 'prj_project_project_repeat'}}</label>
					
					<div id="toggleDropDown" class="dropdown w-100">
		            <button class="btn btn-white dropdown-toggle w-100 text-left" style="border:0.3px solid #C0C0C0" type="button" data-bs-toggle="dropdown" aria-expanded="false">
		                {{transl 'prj_project_project_repeat'}}
		            </button>
		            <ul id="weekdayDropdown" class="dropdown-menu w-100 overflow-auto" style="max-height: 200px;">
		                <li>
		                    <label class="dropdown-item">
		                        <input type="checkbox" data-group="inf02" data-name="repeat-day" value="Mon" class="form-check-input me-2">
		                        {{transl 'prj_repeat_one'}}
		                    </label>
		                </li>
		                <li>
		                    <label class="dropdown-item">
		                        <input type="checkbox" data-group="inf02" data-name="repeat-day" value="Tue" class="form-check-input me-2">
		                        {{transl 'prj_repeat_two'}}
		                    </label>
		                </li>
		                <li>
		                    <label class="dropdown-item">
		                        <input type="checkbox" data-group="inf02" data-name="repeat-day" value="Wed" class="form-check-input me-2">
		                        {{transl 'prj_repeat_three'}}
		                    </label>
		                </li>
		                <li>
		                    <label class="dropdown-item">
		                        <input type="checkbox" data-group="inf02" data-name="repeat-day" value="Thu" class="form-check-input me-2">
		                        {{transl 'prj_repeat_four'}}
		                    </label>
		                </li>
		                <li>
		                    <label class="dropdown-item">
		                        <input type="checkbox" data-group="inf02" data-name="repeat-day" value="Fri" class="form-check-input me-2">
		                        {{transl 'prj_repeat_five'}}
		                    </label>
		                </li>
		                <li>
		                    <label class="dropdown-item">
		                        <input type="checkbox" data-group="inf02" data-name="repeat-day" value="Sat" class="form-check-input me-2">
		                        {{transl 'prj_repeat_six'}}
		                    </label>
		                </li>
		                <li>
		                    <label class="dropdown-item">
		                        <input type="checkbox" data-group="inf02" data-name="repeat-day" value="Sun" class="form-check-input me-2">
		                        {{transl 'prj_repeat_seven'}}
		                    </label>
		                </li>
		            </ul>
		        </div>
			</div>
			<div class="col-lg-6">
				<label for="" class="col-form-label h5">{{transl 'prj_project_project_frequency'}}</label>
                <select data-group="inf02" data-name="repeat" class="form-control objData">
                    <option value="1">{{transl 'prj_frequency_one'}}</option>
                    <option value="2">{{transl 'prj_frequency_two'}}</option>
                    <option value="3">{{transl 'prj_frequency_three'}}</option>
                    <option value="4">{{transl 'prj_frequency_four'}}</option>
                </select>
			</div>
		</div>

			<div class="form-group row mb-2">
				<div class="col-lg-12">
					<div data-repeater-list="inner-group" class="inner form-group mb-0 row">
	    				<div class="col-lg-12">
	        				<label class="col-form-label h5">{{transl 'prj_project_add_team'}}</label>
	        				<div data-repeater-item class="inner ml-md-auto">
	            				<div class="mb-3 row align-items-center">
	                				<div class="col-md-3 hide">
					                    <div class="mt-2 mt-md-0">
					                        <select class="form-control" id="sel_member_type">
					                            <option value="0">{{transl 'prj_project_lev_bas'}}</option>
					                            <option value="1" selected>{{transl 'prj_project_lev_haute'}}</option>
					                        </select>
					                    </div>
	                				</div>
	                                <div class="col-md-4">
										<div class="mt-2 mt-md-0">
											<div class="form-control" id="sel_member_level" data-external-mem="true" value="40">{{transl 'prj_project_member_level_worker'}}</div>
	                                    </div>
	                                </div>
									<div class="col-md-8">
									    <input type="text" class="inner form-control inp-name-member" placeholder="{{transl 'prj_project_enter_name'}}" />
									</div>
	
								</div>
							</div>
						</div>
					</div>
	                <div class="row justify-content-end">
	                    <div class="col-lg-12" id="div_list_member"></div>
	                </div>
				</div>
			</div>
		</div>
    </div>
</div>
