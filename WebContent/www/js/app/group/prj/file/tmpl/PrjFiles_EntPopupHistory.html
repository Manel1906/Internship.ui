
   <div class="row" id="div_date_period">
	    <div class="col-sm-3">
	        <div class="input-daterange input-group" style="max-height: 68vh; overflow-y: scroll;">
	            <input data-format="date" type="text" id="inp_dt_begin_history" data-validation="date" class="form-control objData " placeholder="{{transl 'prj_history_begin_date'}}" data-name="dtBegin" data-provide="datepicker" data-date-format="dd/mm/yyyy">
	        </div>
	    </div>
	     <div class="col-sm-3">
	        <div class="input-daterange input-group" style="max-height: 68vh; overflow-y: scroll;">
	            <input data-format="date" type="text" id="inp_dt_end_history" data-validation="date" class="form-control objData " placeholder="{{transl 'prj_history_end_date'}}" data-name="dtEnd" data-provide="datepicker" data-date-format="dd/mm/yyyy">
	        </div>
	    </div>
	    <div class="col-sm-6 align-items-center justify-content-start div-search">
	        <input class="form-control" type="text" id="inp_filter_history" placeholder="{{transl 'prj_history_filter_keyword'}}">
	    </div>
	</div>
	<br/>
	<br/>  
	 {{#if this.arrChild}}
    <div class="row">
        <div class="col-12">
            <div style="max-height:68vh; overflow-y: scroll;"  id = "div_str">
                <ul class="verti-timeline list-unstyled" style="max-height: 300px; overflow: auto;">
		        	{{#if this.arrChild}}
		        	{{#each this.arrChild}}
		            <li class="event-list">
		                <div class="event-timeline-dot" style="left: 2px !important;">
		                    <i class="bx bx-right-arrow-circle font-size-18"></i>
		                </div>
		                <div class="media">
		                    <div class="mr-3">
		                        <h5 class="font-size-14"> {{reqFormatDate dt}} <i class="bx bx-right-arrow-alt font-size-16 text-primary align-middle ml-2"></i></h5>
		                    </div>
		                     <div class="mr-9">
		                       <div>{{{reqContentHis this}}} </div>
		                    </div>
		                </div>
		            </li>
		            {{/each}}
		            {{else}}
		            <li class="event-list">{{transl 'prj_dashboard_history_no'}}</li>
		            {{/if}}
		        </ul>
            </div>
        </div>
    </div>
    {{/if}}
