<div class="page-content">

		<div>
			<div class="row">
				<div class="col-xs-12 col-sm-12 justify-content-between col-md-12 col-lg-12 d-flex align-items-center">
				<div class="d-flex align-items-center">
					<label class="switch ml-2">
			           <input type="checkbox" id="toggleNav">
			           <span class="slider"></span>
			       </label>
				<div id="dp_nav_btn" class="gap-1 align-items-center ml-2" style="display: none;">
					 <button id="previous" class="btn btn-light rounded-circle border mx-1">
				        <i class='bx bx-chevron-left' style="font-size: 15px; color: #808080;"></i>
				    </button>
				    <button id="next" class="btn btn-light rounded-circle border mx-1">
				        <i class='bx bx-chevron-right' style="font-size: 15px; color: #808080;"></i>
				    </button>
				    <input type="text" id="nav_calendar_show" class="position-absolute" style="opacity: 0; pointer-events: none;top:20px">
				    <div class="btn btn-light rounded-circle border mx-1" id="nav_calendar">
				        <img src="www/img/icon/appointment.png" alt="Calendar" style="height: 20px; filter: grayscale(100%);">
				    </div>
				  </div>
				</div>
					<div class="d-flex align-items-center">
				        <button class="btn btn-primary ml-1" type="button" id="btn_create_prj">{{transl "prj_appointment_btn_new"}}</button>
				        <div class="ml-4" id="last_appointment"></div>
				        <div class="ml-4 d-flex align-items-center" id="daily_appointment">
				            <b></b><span class="badge badge-danger badge-pill ml-1"></span>
				        </div>
				        <div class="ml-4 d-flex align-items-center" id="weekly_appointment">
				            <img src="www/img/icon/appointment.png" alt="" style="height: 18px;">
				            <span class="badge badge-primary badge-pill ml-1"></span>
				        </div>
				    </div>
				</div>				
			</div>
			<br/>
			<div class="row">
			<div class="col-md-12">
				{{#if forDesktop}}
				<div class="main" style="display: flex;">
					<div style="">
						<div id="dp_nav"></div>
					</div>
					<div style="flex-grow: 1; margin-left: 5px;">
						<div id="dp_schedule"></div>
					</div>
				</div>

				{{else}}
<!-- 				<div class="col-12"> -->
					<div id="dp_nav"></div>
					<br/>
<!-- 				</div> -->
<!-- 				<div class="col-12"> -->
					<div id="dp_schedule"></div>
<!-- 				</div> -->
				{{/if}}	
					
					
				<br />
				<div class="wygo-order-box-description" style="display:none" id="schedule_toolTip"><b><i><span
								style="color: blue"> </span></i></b></div>
				{{#ifCond listSize '==' 0 }}
				<div class="errMsg" style="display: contents;">{{transl "order_placeorder_nolist"}}</div>
				{{/ifCond}}
			</div>
			</div>
		</div>

</div>
