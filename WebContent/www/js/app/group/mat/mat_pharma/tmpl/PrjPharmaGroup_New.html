<div class="card">
    <div class="card-body">
        <div class="row">
        	{{#if edit}}
        	<div class="col-lg-11 col-md-10 col-sm-9"><h4>{{transl 'tpy_cat_disease_edit_title'}}</h4></div>
        	{{else}}
            <div class="col-lg-11 col-md-10 col-sm-9"><h4>{{transl 'tpy_cat_disease_new_title'}}</h4></div>
             {{/if}}
        	<div class="col-lg-1 col-md-2 col-sm-3 text-center"><i id="cancel_header" class="mdi mdi-window-close cursor-pointer" style="font-size: 20px; color: red;"></i></div>
        </div>
        <div class="needs-validation" id="frm_new_group">
        	<input type="hidden" data-name="typ01" class="form-control objData" value="1">
        	<input type="hidden" data-name="typ02" class="form-control objData" value="1">
        	<input type="hidden" data-name="stat" class="form-control objData" value="1">
            <div><hr class="badge-info" style="height: 1px; width: 100%;"></div>
           	
           	<div class="row">
           		<div class="col-12 form-group mt-1">	
		            <div class="form-group">
<!-- 		                <label for="inp_group_name">{{transl 'prj_ tpy_group_name'}} *</label> -->
		                <input type="text" data-name="name01" class="form-control objData" id="inp_group_name" value="{{name01}}" placeholder="{{transl 'prj_tpy_group_name_enter'}}" data-validation="required" >
					</div>	
		        </div>
		        <div class="col-12 form-group mb-1 mt-1">	
			        <div class="form-group">
<!-- 			    <label for="inp_group_locate">{{transl 'prj_tpy_group_brand_name_medicine'}}</label> -->
				        <input type="text" data-name="name02" class="form-control objData" id="inp_group_locate" placeholder="{{transl 'prj_tpy_group_brand_name_medicine'}}" value="{{name02}}" data-validation="required">
				    </div>
			    </div>
            	<div class="col-md-12 mb-4 d-flex justify-content-start p-0">	
		           <div class="form-group col-4">
					    <label for="inp_group_locate">{{transl 'prj_tpy_group_bar_code_ori'}}</label>
					    <div class="input-group">
					        <input type="text" data-name="code01" class="form-control objData" id="inp_group_locate" value="{{code01}}" data-validation="required">
					        <div class="input-group-append">
					            <span class="input-group-text"><i class="mdi mdi-qrcode-scan"></i></span>
					        </div>
					    </div>
					</div>

					<div class="form-group col-4">
					    <label for="inp_group_phone">{{transl 'prj_tpy_group_bar_code_internal_1'}}</label>
					    <div class="input-group">
					        <input type="text"  data-name="code03" class="form-control objData" id="inp_group_phone" value="{{code03}}" data-validation="">
					        <div class="input-group-append">
					            <span class="input-group-text"><i class="mdi mdi-qrcode-scan"></i></span>
					        </div>
					    </div>
					</div>
				
					<div class="form-group col-4">
					    <label for="inp_group_email">{{transl 'prj_tpy_group_bar_code_internal_2'}}</label>
					    <div class="input-group">
					        <input type="text" data-name="code04" class="form-control objData" id="inp_group_email" value="{{code04}}" data-validation="">
					        <div class="input-group-append">
					            <span class="input-group-text"><i class="mdi mdi-qrcode-scan"></i></span>
					        </div>
					    </div>
					</div>
		        </div>
		        <div class="col-md-12 mb-4 d-flex justify-content-between align-items-center p-0">
				    <div class="form-group col-4 px-2">
				        <label for="inp_group_select">{{transl 'prj_tpy_group_medicine'}}</label>
				        <select id="inp_group_select" class="form-control objData content-edit isManager" data-name="typ03">
				            <option {{#equal typ03 100}}selected{{/equal}} value="100">{{transl 'aut_test_ent_grp_medicine_stat_100'}}</option>
				            <option {{#equal typ03 200}}selected{{/equal}} value="200">{{transl 'aut_test_ent_grp_medicine_stat_200'}}</option>
				            <option {{#equal typ03 500}}selected{{/equal}} value="500">{{transl 'aut_test_ent_grp_medicine_stat_500'}}</option>
				            <option {{#equal typ03 300}}selected{{/equal}} value="300">{{transl 'aut_test_ent_grp_medicine_stat_300'}}</option>
				            <option {{#equal typ03 700}}selected{{/equal}} value="700">{{transl 'aut_test_ent_grp_medicine_stat_700'}}</option>
				            <option {{#equal typ03 900}}selected{{/equal}} value="900">{{transl 'aut_test_ent_grp_medicine_stat_900'}}</option>
				        </select>
				    </div>
				    <div class="form-group col-4 px-2">
				        <label for="inp_group_email">{{transl 'prj_tpy_group_reg_number_visa'}}</label>
				        <input type="number" data-name="code02" class="form-control objData" id="inp_group_email" value="{{code02}}" data-validation="required">
				    </div>
				    <div class="form-group input-daterange col-4 px-2">
				        <label for="inp_group_email">{{transl 'prj_tpy_group_exp_visa'}}</label>
				        <div class="input-group ">
					        <input data-format="date" type="text" data-validation="date required"
					               class="form-control objData" id="dtpicker_exp"
					               placeholder="" data-group="dt03"
					               data-name="date" data-provide="datepicker"
					               data-date-format="dd/mm/yyyy" data-validation="required" />
					        <input type="text" class="form-control objData tmpicker"
					               id="tmpicker_exp" placeholder=""
					               data-group="dt03" data-name="time" data-provide="timepicker" data-validation="required" />
				        </div>
				    </div>
				</div>

		        <div class="col-md-12 mb-4 d-flex justify-content-start p-0">	
		            <div class="col-4 mb-2 mt-2">	
				        <label for="inp_group_select">{{transl 'prj_tpy_group_producer'}}</label>
				        <select id="inp_group_select" class="form-control objData content-edit isManager" data-name="prodId">
				            <option {{#equal typ03 2}}selected{{/equal}} value="2">{{transl 'aut_test_ent_manu_medicine_stat_2'}}</option>
				            <option {{#equal typ03 3}}selected{{/equal}} value="3">{{transl 'aut_test_ent_manu_medicine_stat_3'}}</option>
				            <option {{#equal typ03 4}}selected{{/equal}} value="4">{{transl 'aut_test_ent_manu_medicine_stat_4'}}</option>
				            <option {{#equal typ03 10}}selected{{/equal}} value="10">{{transl 'aut_test_ent_manu_medicine_stat_10'}}</option>
				        </select>
			    	</div>
					<div class="col-4 mb-2 mt-2"">	
				        <label for="inp_group_select">{{transl 'prj_tpy_group_package'}}</label>
				        <select id="inp_group_select" class="form-control objData content-edit isManager" data-name="inf02">
				            <option {{#equal typ03 5}}selected{{/equal}} value="5">{{transl 'aut_test_ent_package_medicine_stat_5'}}</option>
				            <option {{#equal typ03 6}}selected{{/equal}} value="6">{{transl 'aut_test_ent_package_medicine_stat_6'}}</option>
				            <option {{#equal typ03 7}}selected{{/equal}} value="7">{{transl 'aut_test_ent_package_medicine_stat_7'}}</option>
				            <option {{#equal typ03 10}}selected{{/equal}} value="10">{{transl 'aut_test_ent_package_medicine_stat_10'}}</option>
				        </select>
			    	</div>
					<div class="col-4 mb-2 mt-2"">	
				        <label for="inp_group_select">{{transl 'prj_tpy_group_unit_min'}}</label>
				        <select id="inp_group_select" class="form-control objData content-edit isManager" data-name="inf01">
				            <option {{#equal typ03 6}}selected{{/equal}} value="6">{{transl 'aut_test_ent_unit_medicine_stat_6'}}</option>
				            <option {{#equal typ03 7}}selected{{/equal}} value="7">{{transl 'aut_test_ent_unit_medicine_stat_7'}}</option>
				            <option {{#equal typ03 8}}selected{{/equal}} value="8">{{transl 'aut_test_ent_unit_medicine_stat_8'}}</option>
				            <option {{#equal typ03 10}}selected{{/equal}} value="10">{{transl 'aut_test_ent_unit_medicine_stat_10'}}</option>
				        </select>
			    	</div>
		        </div>
	        </div>
	        
        	<div class="col-lg-12 mt-4" id="div_create_introduce">
				<label for="introduce" class="col-form-label">{{transl 'prj_tpy_group_desc'}}</label>
				<div class="">
				    <textarea class="form-control objData" data-group="inf03" data-name="desc" id="introduce" rows="5" placeholder="{{transl 'prj_ tpy_group_introduce'}}" data-validation="">{{inf03.desc}}</textarea>
				</div>
           	</div>
           	
           	<div class="col-lg-12 mt-4" id="div_create_service">
				<label for="service" class="col-form-label">{{transl 'prj_tpy_group_effect'}}</label>
				<div class="">
				    <textarea class="form-control objData" data-group="inf03" data-name="effect" id="service" rows="5" placeholder="{{transl 'prj_ tpy_group_service'}}" data-validation="">{{inf03.effect}}</textarea>
				</div>
           	</div>
           	
  			<div class="col-lg-12 mt-4" id="div_create_mission">
				<label for="mission" class="col-form-label">{{transl 'prj_tpy_group_assign'}}</label>
				<div class="">
				    <textarea class="form-control objData" data-group="inf03" data-name="assign" id="mission" rows="5" placeholder="{{transl 'prj_ tpy_group_mission'}}" data-validation="">{{inf03.assign}}</textarea>
				</div>
           	</div>
           	 
           	<div class="col-lg-12 mt-4" id="div_create_information">
				<label for="information" class="col-form-label">{{transl 'prj_tpy_group_another_inf'}}</label>
				<div class="">
				    <textarea class="form-control objData" data-group="inf03" data-name="infor" id="information" rows="5" placeholder="{{transl 'prj_ tpy_group_information'}}" data-validation="">{{inf03.infor}}</textarea>
				</div>
           	</div>
           	
            <div class="row mt-4">
            	<div class="col-lg-6 col-md-4 col-sm-12 col-xm-12 form-group mb-4">
					<label for="inp_group_descr">{{transl 'prj_tpy_group_avatar'}}</label>
					<div id="frm_dropzone_send" class="fallback">

						<form action="/" method="post" class="dropzone inputfile">
							<div class="fallback">
								<input data-name="files" type="file" class="objData" data-typ01="1" data-typ02="1">
							</div>
		
							<div class="dz-message needsclick">
								<div class="mb-3">
									<i class="display-4 text-muted bx bxs-cloud-upload"></i>
								</div>
								<h4>{{transl 'prj_project_drop_files'}}</h4>
							</div>
						</form>
					</div>
				</div>
				
				<div class="col-lg-6 col-md-4 col-sm-12 col-xm-12 form-group mb-4">
					<label for="inp_group_descr">{{transl 'prj_tpy_group_files'}}</label>
					<div id="frm_dropzone_send_file" class="fallback">

						<form action="/" method="post" class="dropzone inputfile">
							<div class="fallback">
								<input data-name="files" type="file" class="objData" data-typ01="2" data-typ02="10" multiple>
							</div>

							<div class="dz-message needsclick">
								<div class="mb-3">
									<i class="display-4 text-muted bx bxs-cloud-upload"></i>
								</div>
								<h4>{{transl 'prj_project_drop_files'}}</h4>
							</div>
						</form>
					</div>
				</div>
	        </div>   
	        
            <div class="d-flex justify-content-end mt-4">
            	<button id="btn_canel_group" class="btn" type="button">{{transl 'prj_tpy_group_new_btn_cancel'}}</button>
			    <button id="btn_create_group" class="btn btn-primary" type="button">{{transl 'prj_tpy_group_new_btn_save'}}</button>
			</div>
        </div>
    </div>
</div>
