<div class="card">
	<div class="card-body">
		<div row class="pull-right">
			<button type="button" class="btn btn-sm px-3 font-size-16 header-item waves-effect" id="vertical-list-btn">
				<i class="fa fa-fw fa-bars"></i>
			</button>
			<a data-divtoogle="#div_JobOff_Lists" class="btn-minimize-list cursor-pointer" data-toggle="tooltip" data-placement="top"
				title="" data-original-title="Resize">
				<i class="mdi mdi-window-minimize font-size-18"></i>
			</a>
		</div>

		<div id="div_JobOff_Lists">
			<div class="box box-default box-solid box-show" id="div_JobOff_List_Draft">
				<div class="box-header with-border btn-minimize" id="div_JobOff_List_Draft_Header">
					<h3 class="box-title">{{transl "job_off_List_Draft"}}</h3>

					<div class="box-tools pull-right">
						<button type="button" class="btn btn-box-tool" data-widget="collapse">
							<i class="fa fa-chevron-down"></i>
						</button>
					</div>
				</div>
				<div class="box-body" id="div_JobOff_List_Draft_Content"></div>
			</div>
			
			<div class="box box-default box-solid box-show" id="div_JobOff_List_Pending">
				<div class="box-header with-border btn-minimize" id="div_JobOff_List_Pending_Header">
					<h3 class="box-title">{{transl "job_off_List_Pending"}}</h3>

					<div class="box-tools pull-right">
						<button type="button" class="btn btn-box-tool" data-widget="collapse">
							<i class="fa fa-chevron-down"></i>
						</button>
					</div>	
				</div>
				<div class="box-body" id="div_JobOff_List_Pending_Content"></div>
			</div>

			<div class="box box-default box-solid box-show" id="div_JobOff_List_Denied">
				<div class="box-header with-border btn-minimize" id="div_JobOff_List_Denied_Header">
					<h3 class="box-title">{{transl "job_off_List_Denied"}}</h3>

					<div class="box-tools pull-right">
						<button type="button" class="btn btn-box-tool" data-widget="collapse">
							<i class="fa fa-chevron-down"></i>
						</button>
					</div>
				</div>
				<div class="box-body" id="div_JobOff_List_Denied_Content"></div>
			</div>
			
			<div class="box box-default box-solid box-show" id="div_JobOff_List_Validated">
				<div class="box-header with-border btn-minimize" id="div_JobOff_List_Validated_Header">
					<h3 class="box-title">{{transl "job_off_List_Validated"}}</h3>

					<div class="box-tools pull-right">
						<button type="button" class="btn btn-box-tool" data-widget="collapse">
							<i class="fa fa-chevron-down"></i>
						</button>
					</div>
				</div>
				<div class="box-body" id="div_JobOff_List_Validated_Content"></div>
			</div>
		</div>
	</div>
</div>
