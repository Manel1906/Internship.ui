<div class="card">
    <div class="card-body">
        <h4 class="hide card-title">{{transl 'prj_user_group_new_title'}}</h4>
        <div class="needs-validation" id="frm_new_group">
        	<input type="hidden" data-name="typ01" class="form-control objData" value="300">
        	<input type="hidden" data-name="stat" class="form-control objData" value="1">
           
           	
           	<div class="row">
           		<div class="col-12 form-group mb-2 mt-2">	
		            <div class="form-group">
<!-- 		                <label for="inp_group_name">{{transl 'prj_user_group_name'}} *</label> -->
		                <input type="text" data-name="name" class="form-control objData" id="inp_group_name" value="{{name}}" placeholder="{{transl 'prj_user_group_name_enter'}}" data-validation="required" maxlength="150">
					</div>	
<!-- 		            <div class="form-group">
		                <label for="inp_group_descr">{{transl 'prj_user_group_descr'}}</label>
		                <textarea class="form-control objData" data-name="descr" rows="9" id="inp_group_descr" placeholder="{{transl 'prj_user_group_descr_enter'}}" cols=""></textarea>
		            </div> -->
		        </div>
            	<div class="col-md-12 mb-4 d-flex justify-content-between p-0">	
		            <div class="form-group col-4">
		                <label for="inp_group_locate">{{transl 'prj_user_group_position'}}</label>
		                <input type="text" data-group="inf01" data-name="room" class="form-control objData" id="inp_group_locate" value="{{inf01.room}}" placeholder="{{transl 'prj_user_group_room_enter'}}" data-validation="" maxlength="50">
					</div>
					<div class="form-group col-4">
		                <label for="inp_group_phone">{{transl 'prj_user_group_phone'}}</label>
		                <input type="text" data-group="inf01" data-name="phone" class="form-control objData" id="inp_group_phone" value="{{inf01.phone}}" placeholder="{{transl 'prj_user_group_sdt_enter'}}" data-validation="" maxlength="50">
					</div>
					<div class="form-group col-4">
		                <label for="inp_group_email">{{transl 'prj_user_group_email'}}</label>
		                <input type="email" data-group="inf01" data-name="email" class="form-control objData" id="inp_group_email" value="{{inf01.email}}" placeholder="{{transl 'prj_user_group_email_enter'}}" data-validation="" maxlength="50">
					</div>
		        </div>
	        </div>
	        
        	<div class="col-lg-12 mt-4" id="div_create_introduce">
				<label for="introduce" class="col-form-label">{{transl 'prj_user_group_introduce'}}</label>
				<div class="">
				    <textarea class="form-control objData" data-group="inf01" data-name="introduce" id="introduce" rows="5" placeholder="{{transl 'prj_user_group_introduce'}}" data-validation="">{{inf01.introduce}}</textarea>
				</div>
           	</div>
           	
           	<div class="col-lg-12 mt-4" id="div_create_service">
				<label for="service" class="col-form-label">{{transl 'prj_user_group_service'}}</label>
				<div class="">
				    <textarea class="form-control objData" data-group="inf02" data-name="service" id="service" rows="5" placeholder="{{transl 'prj_user_group_service'}}" data-validation="">{{inf02.service}}</textarea>
				</div>
           	</div>
           	
  			<div class="col-lg-12 mt-4" id="div_create_mission">
				<label for="mission" class="col-form-label">{{transl 'prj_user_group_mission'}}</label>
				<div class="">
				    <textarea class="form-control objData" data-group="inf02" data-name="mission" id="mission" rows="5" placeholder="{{transl 'prj_user_group_mission'}}" data-validation="">{{inf02.mission}}</textarea>
				</div>
           	</div>
           	 
           	<div class="col-lg-12 mt-4" id="div_create_information">
				<label for="information" class="col-form-label">{{transl 'prj_user_group_information'}}</label>
				<div class="">
				    <textarea class="form-control objData" data-group="inf02" data-name="information" id="information" rows="5" placeholder="{{transl 'prj_user_group_information'}}" data-validation="">{{inf02.information}}</textarea>
				</div>
           	</div>
           	
            <div class="row mt-4">
            	<div class="col-lg-6 col-md-4 col-sm-12 col-xm-12 form-group mb-4">
					<label for="inp_group_descr">{{transl 'prj_user_group_avatar'}}</label>
					<div id="frm_dropzone_send" class="fallback">

						<form action="/" method="post" class="dropzone inputfile">
							<div class="fallback">
								<input data-name="files" type="file" class="objData" data-typ01="1" data-typ02="1">
							</div>
		
							<div class="dz-message needsclick">
								<div class="mb-3">
									<i class="display-4 text-muted bx bxs-cloud-upload"></i>
								</div>
								<h4>{{transl 'prj_project_drop_files'}}</h4>
							</div>
						</form>
					</div>
				</div>
				
				<div class="col-lg-6 col-md-4 col-sm-12 col-xm-12 form-group mb-4">
					<label for="inp_group_descr">{{transl 'prj_user_group_files'}}</label>
					<div id="frm_dropzone_send_file" class="fallback">

						<form action="/" method="post" class="dropzone inputfile">
							<div class="fallback">
								<input data-name="files" type="file" class="objData" data-typ01="2" data-typ02="10" multiple>
							</div>

							<div class="dz-message needsclick">
								<div class="mb-3">
									<i class="display-4 text-muted bx bxs-cloud-upload"></i>
								</div>
								<h4>{{transl 'prj_project_drop_files'}}</h4>
							</div>
						</form>
					</div>
				</div>
	        </div>   
	        
            <div class="d-flex justify-content-end mt-4">
            	<button id="btn_canel_group" class="btn" type="button">{{transl 'prj_user_group_new_btn_cancel'}}</button>
			    <button id="btn_create_group" class="btn btn-primary" type="button">{{transl 'prj_user_group_new_btn_save'}}</button>
			</div>
        </div>
    </div>
</div>
