<div class="card meeting-card" style="width: 250px; margin-bottom: 1rem;">
	<div class="row align-items-center" style="padding: 20px 20px 0px 20px">
	    <h5 class="col-auto">{{transl 'prj_appointment_next'}}</h5>
<!-- 	    <a href="javascript:void(0)" class="text-dark font-size-14 font-weight-bold col-auto ml-auto" id="btn_refresh_group"> -->
<!-- 	        <i class="mdi mdi-refresh font-size-18 mr-2"></i> -->
<!-- 	    </a> -->
	</div>

	<div class="card-body">
		{{#each appointments}}
		<div class="row mb-2">
			<div class="col-12">  
				<div class="row col-12">
	 				<p class="mb-2"><i class="mdi mdi-clock"></i> {{formatDate dtBegin "date"}}</p>	
	 				<div class="col-1"></div>
	 				<div class="col-5">
		 				<span class="bg-danger text-white rounded" id="countdown-{{@index}}"> 
		 					<i class="mdi mdi-bell ml-1"></i> <span class="time-remaining" data-appointment-time="{{dtBegin}}"></span> 
		 				</span>
		 			</div>
	 			</div>
			</div>
			<div class="col-12">
				<p><i class="mdi mdi-calendar-clock"></i> {{formatDate dtBegin "time"}} - {{formatDate dtEnd "time"}}</p>
			</div>
			
			{{#if name}}
			<div class="col-12">
				<h5 class="card-title">{{name}}</h5>
			</div>
			{{/if}}
			
			<div class="col-12">
				<p class="mb-2"><i class="mdi mdi-map-marker"></i> {{inf01}}</p>
			</div>
			
			<div class="col-12">
				<button  class="btn btn-info text-white div_button_call" data-appointment-id="{{id}}">
					{{transl 'common_btn_join'}}
				</button>
			</div>
		</div>
		
		<div class="d-flex justify-content-between align-items-center">
			<div class="div_list_member d-flex">
				{{#each members}}
				<div class='team-member member-item d-flex align-items-center'>
					{{#if avatar}}
					<img src='{{avatar}}' class='rounded-circle avatar-xs {{opacity}} mr-1'/>
					{{else}}
					<div class="rounded-circle avatar-xs text-white mr-1 text-uppercase text-center {{opacity}}" style="background-color: {{textColor}}">
						<div class="text-middle">{{textAvatar}}</div>
					</div>
					{{/if}}
				</div>
				{{/each}}
			</div>
		</div>
		<hr/>
		{{/each}}
	
	</div>
</div>
